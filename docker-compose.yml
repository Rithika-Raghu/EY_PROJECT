# docker-compose.yml (for easy deployment)
"""
version: '3.8'

services:
  # FastAPI Backend
  api:
    build: .
    container_name: smartloan_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/smartloan
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./sanction_letters:/app/sanction_letters
      - ./logs:/app/logs
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: smartloan_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=smartloan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: smartloan_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Celery Worker
  celery_worker:
    build: .
    container_name: smartloan_celery_worker
    command: celery -A tasks.celery_tasks worker --loglevel=info
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - api
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs

  # Celery Beat (Scheduler)
  celery_beat:
    build: .
    container_name: smartloan_celery_beat
    command: celery -A tasks.celery_tasks beat --loglevel=info
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
      - celery_worker
    volumes:
      - ./logs:/app/logs

  # Frontend (React)
  frontend:
    build: ./frontend
    container_name: smartloan_frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
"""

# Dockerfile
"""
FROM python:3.11-slim

WORKDIR /app

# Install system dependencies
RUN apt-get update && apt-get install -y \
    gcc \
    g++ \
    && rm -rf /var/lib/apt/lists/*

# Copy requirements
COPY requirements.txt .

# Install Python dependencies
RUN pip install --no-cache-dir -r requirements.txt